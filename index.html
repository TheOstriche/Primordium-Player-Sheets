<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2233">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Primordium">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<title>Primordium Character Sheet</title>
</head>
<body>
<header class="top">
  <button id="backBtn" class="iconbtn" aria-label="All characters" hidden>‹</button>
  <h1 id="title">Primordium</h1>
  <button id="menuBtn" class="iconbtn" aria-label="Backup and settings">⋯</button>
</header>
<main id="view"></main>
<nav id="tabs" class="tabs" hidden></nav>
<dialog id="menu">
  <h2>Backup</h2>
  <p>Characters are saved on this device. Export a backup to move them to another phone or keep them safe.</p>
  <button id="exportBtn" class="btn">Export all characters</button>
  <label class="btn ghost">Import a backup<input id="importFile" type="file" accept="application/json" hidden></label>
  <button id="closeMenu" class="btn ghost">Close</button>
</dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="data.js"></script>
<script src="primordium-data.js"></script>
<script src="app.js"></script>
</body>
</html>
